name: Build StageLite

# Compila el mod y deja el .jar listo para descargar.
# Se ejecuta solo al subir cambios, o a mano desde la pestaña "Actions" -> "Run workflow".
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ForgeGradle 6 para 1.20.1 necesita Gradle 8.1.1
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Compilar
        run: gradle build --no-daemon

      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: stagelite-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Publica el .jar en la pestaña "Releases" (enlace directo de descarga)
      - name: Publicar release "latest"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar \
            --title "StageLite - ultimo build" \
            --notes "Compilado automaticamente desde el commit ${GITHUB_SHA::7}. Poner el .jar en la carpeta mods (servidor y jugadores), Forge 1.20.1." \
            --target "$GITHUB_SHA"
